<svg width="1400" height="360" viewBox="0 0 1400 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ganesh Kumar SOC Analyst Portfolio</title>
  <desc id="desc">A professional blue-team cybersecurity banner with SOC dashboard style graphics.</desc>
  <defs>
